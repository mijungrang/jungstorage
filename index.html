<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인천시 새소식 & 일자리</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tab-button {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .tab-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .tab-button.active {
      background: white;
      color: #667eea;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.2rem;
      padding: 40px;
    }

    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: rgba(255, 59, 48, 0.9);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: center;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-badge {
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-date {
      color: #999;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .card-content {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    .refresh-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: white;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    .refresh-button:hover {
      transform: scale(1.1);
    }

    .refresh-button svg {
      width: 24px;
      height: 24px;
      fill: #667eea;
    }

    .empty-state {
      text-align: center;
      color: white;
      padding: 60px 20px;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .empty-state p {
      font-size: 1rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.8rem;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

      .tab-button {
        padding: 10px 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏙️ 인천시 정보</h1>
      <p>새소식과 일자리 정보를 한눈에</p>
    </div>

    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('news')">
        📰 새소식
      </button>
      <button class="tab-button" onclick="switchTab('jobs')">
        💼 일자리
      </button>
    </div>

    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>데이터를 불러오는 중...</p>
    </div>

    <div id="error" style="display: none;"></div>

    <div id="news-section" class="content-section active">
      <div id="news-content" class="card-grid"></div>
    </div>

    <div id="jobs-section" class="content-section">
      <div id="jobs-content" class="card-grid"></div>
    </div>
  </div>

  <button class="refresh-button" onclick="loadData()" title="새로고침">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </svg>
  </button>

  <script>
    let currentData = null;

    // 페이지 로드 시 데이터 가져오기
    window.addEventListener('load', loadData);

    function loadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';

      google.script.run
        .withSuccessHandler(onDataSuccess)
        .withFailureHandler(onDataError)
        .fetchIncheonData();
    }

    function onDataSuccess(data) {
      console.log('받은 데이터:', data);
      currentData = data;

      document.getElementById('loading').style.display = 'none';

      // 새소식 렌더링
      renderNews(data.news);

      // 일자리 렌더링
      renderJobs(data.jobs);
    }

    function onDataError(error) {
      console.error('데이터 로드 실패:', error);
      document.getElementById('loading').style.display = 'none';

      const errorDiv = document.getElementById('error');
      errorDiv.innerHTML = `
        <div class="error">
          <h3>❌ 데이터를 불러올 수 없습니다</h3>
          <p>${error.message || '알 수 없는 오류가 발생했습니다.'}</p>
          <button onclick="loadData()" style="margin-top: 15px; padding: 10px 20px; background: white; color: #ff3b30; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
            다시 시도
          </button>
        </div>
      `;
      errorDiv.style.display = 'block';
    }

    function renderNews(newsData) {
      const container = document.getElementById('news-content');

      if (newsData.error) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>❌ 오류 발생</h3>
            <p>${newsData.error}</p>
          </div>
        `;
        return;
      }

      if (!Array.isArray(newsData) || newsData.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>📭 새소식이 없습니다</h3>
            <p>현재 등록된 새소식이 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = newsData.map(item => {
        const title = item.TITLE || item.title || '제목 없음';
        const content = item.CONTENT || item.content || '';
        const date = formatDate(item.REG_DATE || item.regDate || item.date);
        const link = item.LINK || item.link || '#';
        const category = item.CATEGORY || item.category || '일반';

        return `
          <div class="card" onclick="window.open('${link}', '_blank')">
            <div class="card-meta">
              <span class="card-badge">${category}</span>
              <span class="card-date">📅 ${date}</span>
            </div>
            <h3 class="card-title">${escapeHtml(title)}</h3>
            ${content ? `<p class="card-content">${escapeHtml(stripHtml(content))}</p>` : ''}
            <a href="${link}" class="card-link" target="_blank" onclick="event.stopPropagation()">
              자세히 보기 →
            </a>
          </div>
        `;
      }).join('');
    }

    function renderJobs(jobsData) {
      const container = document.getElementById('jobs-content');

      if (jobsData.error) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>❌ 오류 발생</h3>
            <p>${jobsData.error}</p>
          </div>
        `;
        return;
      }

      if (!Array.isArray(jobsData) || jobsData.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>📭 일자리 정보가 없습니다</h3>
            <p>현재 등록된 일자리 정보가 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = jobsData.map(item => {
        const title = item.TITLE || item.title || '제목 없음';
        const company = item.COMPANY || item.company || item.ORGAN || '';
        const location = item.LOCATION || item.location || item.ADDR || '';
        const period = item.PERIOD || item.period || '';
        const date = formatDate(item.REG_DATE || item.regDate || item.date);
        const link = item.LINK || item.link || '#';

        return `
          <div class="card" onclick="window.open('${link}', '_blank')">
            <div class="card-meta">
              <span class="card-badge">채용</span>
              <span class="card-date">📅 ${date}</span>
            </div>
            <h3 class="card-title">${escapeHtml(title)}</h3>
            <div style="margin-bottom: 10px;">
              ${company ? `<p style="color: #333; font-weight: 600; margin-bottom: 5px;">🏢 ${escapeHtml(company)}</p>` : ''}
              ${location ? `<p style="color: #666; font-size: 0.9rem; margin-bottom: 5px;">📍 ${escapeHtml(location)}</p>` : ''}
              ${period ? `<p style="color: #666; font-size: 0.9rem;">⏰ ${escapeHtml(period)}</p>` : ''}
            </div>
            <a href="${link}" class="card-link" target="_blank" onclick="event.stopPropagation()">
              지원하기 →
            </a>
          </div>
        `;
      }).join('');
    }

    function switchTab(tab) {
      // 모든 탭 버튼 비활성화
      document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
      });

      // 모든 섹션 숨기기
      document.querySelectorAll('.content-section').forEach(section => {
        section.classList.remove('active');
      });

      // 선택된 탭 활성화
      if (tab === 'news') {
        document.querySelector('.tab-button:nth-child(1)').classList.add('active');
        document.getElementById('news-section').classList.add('active');
      } else if (tab === 'jobs') {
        document.querySelector('.tab-button:nth-child(2)').classList.add('active');
        document.getElementById('jobs-section').classList.add('active');
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '날짜 없음';

      // YYYYMMDD 형식을 YYYY-MM-DD로 변환
      if (dateStr.length === 8 && !dateStr.includes('-')) {
        return `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
      }

      return dateStr;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }
  </script>
</body>
</html>
